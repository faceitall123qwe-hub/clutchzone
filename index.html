<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clutchzone — free browser tactical shooter</title>
  <meta name="description" content="Clutchzone: a free tactical first-person shooter in your browser. No download, no account — open the link and play online with up to 10 players.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23e2b23c' stroke-width='2'/%3E%3Cpath d='M8 0v5M8 11v5M0 8h5M11 8h5' stroke='%23e2b23c' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; font-family: system-ui, sans-serif; user-select: none; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 2px #000a; }
    /* cartoon lettering: a chunky face with a thick dark outline */
    .toon, #health .row, #ammo .row, #round > b, #round .mid span, #result b, #banner b, #start h1, #dead b, #slots span {
      font-family: "Lilita One", system-ui, sans-serif; font-weight: 400; paint-order: stroke fill;
      -webkit-text-stroke: 5px #14161c; text-shadow: 0 3px 0 #14161c; letter-spacing: .03em; }
    #hint, #act span, #spec, #carrier span, #target { font-family: "Lilita One", system-ui, sans-serif; font-weight: 400;
      font-size: 20px; paint-order: stroke fill; -webkit-text-stroke: 4px #14161c; text-shadow: 0 2px 0 #14161c; letter-spacing: .03em; }
    #xhair { --gap: 5px; position: absolute; left: 50%; top: 50%; }
    #xhair i { position: absolute; background: #6dff7a; box-shadow: 0 0 0 1px #0008; }
    #xhair .t, #xhair .b { width: 2px; height: 8px; left: -1px; }
    #xhair .l, #xhair .r { height: 2px; width: 8px; top: -1px; }
    #xhair .t { bottom: var(--gap); } #xhair .b { top: var(--gap); }
    #xhair .l { right: var(--gap); } #xhair .r { left: var(--gap); }
    #scope { position: absolute; inset: 0; display: none; background: radial-gradient(circle at center, transparent 0 41vh, #000 41.3vh); }
    #scope::before, #scope::after { content: ""; position: absolute; background: #000; }
    #scope::before { left: 0; right: 0; top: 50%; height: 1px; }
    #scope::after { top: 0; bottom: 0; left: 50%; width: 1px; }
    #scope i { position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1px; background: #d22; border-radius: 50%; }
    #hitmark { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; opacity: 0;
      background: linear-gradient(45deg, transparent 45%, #fff 45% 55%, transparent 55%),
                  linear-gradient(-45deg, transparent 45%, #fff 45% 55%, transparent 55%);
      -webkit-mask: radial-gradient(circle, transparent 5px, #000 5px); mask: radial-gradient(circle, transparent 5px, #000 5px); }
    #hitmark.on { opacity: 1; } #hitmark.head { opacity: 1; filter: sepia(1) saturate(6) hue-rotate(5deg); }
    #hitmark.kill { opacity: 1; filter: sepia(1) saturate(9) hue-rotate(-45deg); transform: scale(1.3); }
    #health { position: absolute; left: 28px; bottom: 26px; width: 180px; }
    #health .row, #ammo .row { display: flex; align-items: baseline; gap: 8px; font-size: 44px; line-height: 1; }
    #health .row span { color: #6dff7a; }
    #health .bar { height: 5px; margin-top: 6px; background: #0007; }
    #health .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #6dff7a, #b8ff8a); transition: width .15s; }
    #health.low .row b, #health.low .row span { color: #ff6b5b; } #health.low .bar i { background: #ff6b5b; }
    #ammo { position: absolute; right: 28px; bottom: 26px; text-align: right; }
    #ammo .row { justify-content: flex-end; }
    #ammo small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
    #ammo .row span { font-size: 18px; opacity: .8; } #ammo b.low { color: #ff6b5b; }
    #reload { height: 4px; margin-top: 6px; background: #0006; display: none; }
    #reload i { display: block; height: 100%; background: #fff; }
    #slots { position: absolute; right: 28px; bottom: 112px; display: grid; gap: 4px; justify-items: end; }
    #slots div { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 12px; font-weight: 600; opacity: .38; background: #0004; }
    #slots div.on { opacity: 1; background: #0008; box-shadow: inset -3px 0 #e2b23c; }
    #slots svg { height: 16px; fill: #fff; filter: drop-shadow(0 1px 1px #000a); }
    #slots kbd { font: 700 11px system-ui; color: #e2b23c; }
    #feed { position: absolute; top: 16px; right: 18px; display: grid; gap: 4px; justify-items: end; }
    #feed .kill { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 14px;
      background: #0b0e13b8; border: 1px solid transparent; border-radius: 3px; transition: opacity .4s; }
    #feed .kill.mine { border-color: #e04a3a; background: #2a0f0dc8; }
    #feed .kill svg { height: 15px; fill: #f2f2f2; filter: drop-shadow(0 1px 1px #000); }
    #feed .hs { color: #ff5a4a; display: flex; } #feed .hs svg { height: 15px; fill: none; }
    .t0 { --team: #f0b84a; } .t1 { --team: #6fb0ff; }
    #feed b.t0, #feed b.t1 { color: var(--team); }
    #feed > .kill > svg:first-child { height: 15px; }
    #round { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px; }
    #round > b { min-width: 44px; padding: 2px 10px; text-align: center; font-size: 30px; background: #0b0e13b8; border-radius: 10px; }
    #round .atk { color: #f0b84a; box-shadow: inset 0 -3px #f0b84a; } #round .def { color: #6fb0ff; box-shadow: inset 0 -3px #6fb0ff; }
    #round .mid { display: grid; justify-items: center; min-width: 76px; padding: 3px 10px; background: #0b0e13d0; }
    #round .mid span { font-size: 28px; font-variant-numeric: tabular-nums; }
    #round .mid span.bomb svg { height: 22px; fill: #ff4a3a; animation: blink 1s steps(2) infinite; }
    #round .mid small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
    #round .pips { display: flex; gap: 3px; }
    #round .pips i { width: 8px; height: 18px; background: #ffffff22; }
    #pa i.on { background: #f0b84a; } #pd i.on { background: #6fb0ff; }
    @keyframes blink { 50% { opacity: .25; } }
    #result { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: none; justify-items: center; gap: 6px;
      padding: 14px 40px; background: linear-gradient(90deg, transparent, #0b0e13d8 20% 80%, transparent); }
    #result b { font-size: 52px; color: var(--team); text-transform: uppercase; }
    #result span { font-size: 15px; opacity: .85; }
    #act { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); display: none; gap: 6px; justify-items: center; font-size: 14px; font-weight: 700; }
    #act div { width: 260px; height: 8px; background: #0008; border: 1px solid #fff4; }
    #act i { display: block; height: 100%; width: 0; background: #e2b23c; }
    #hint { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); font-size: 14px; font-weight: 600; color: #ffe08a; }
    #spec { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); display: none; padding: 6px 16px; font-size: 15px; background: #0b0e13b8; }
    #carrier { position: absolute; right: 28px; bottom: 214px; display: none; align-items: center; gap: 8px; padding: 4px 10px; font-size: 12px;
      font-weight: 700; color: #ffd27a; background: #2a1a0dc8; border: 1px solid #e2b23c88; }
    #carrier svg { height: 16px; fill: #ffd27a; }
    #notices { position: absolute; left: 28px; bottom: 96px; display: grid; gap: 3px; font-size: 13px; opacity: .85; }
    #notices div { transition: opacity .4s; }
    #feed .out, #notices .out { opacity: 0; }
    #stats { position: absolute; top: 190px; left: 14px; font-size: 13px; opacity: .85; }
    #radar { position: absolute; top: 12px; left: 12px; width: 168px; height: 168px; border: 1px solid #ffffff22; border-radius: 4px; }
    #banner { position: absolute; left: 50%; top: 64%; transform: translateX(-50%); display: none; text-align: center; }
    #banner.pop { display: grid; gap: 4px; justify-items: center; animation: pop .25s ease-out; }
    #banner b { font-size: 30px; color: #ffd23f; }
    #banner span { font-size: 13px; opacity: .85; }
    #banner .skulls { display: flex; gap: 6px; }
    #banner .skulls i { width: 22px; height: 22px; background: #ff5a4a; transform: rotate(45deg); border: 2px solid #fff; box-shadow: 0 0 8px #ff5a4a; }
    @keyframes pop { from { transform: translateX(-50%) scale(1.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
    #dirs i { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px; border-radius: 50%;
      border-top: 6px solid #ff3b2f; filter: drop-shadow(0 0 6px #f00); animation: fade 1.2s forwards;
      -webkit-mask: conic-gradient(from -25deg, #000 50deg, transparent 50deg); mask: conic-gradient(from -25deg, #000 50deg, transparent 50deg); }
    @keyframes fade { to { opacity: 0; } }
    #start { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0e13c0; color: #e9e4d8; overflow-y: auto; }
    #start .card { background: #1d2333; border: 4px solid #14161c; border-radius: 22px; box-shadow: 0 10px 0 #14161c;
      padding: 30px 40px; width: min(420px, 90vw); margin: 16px 0; }
    #meta { margin-top: 18px; }
    /* side by side where there is room, so Quick play is on screen even in an 800x450 portal frame */
    @media (min-width: 760px) {
      #start .card { box-sizing: border-box; width: min(880px, 94vw); display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
      #meta { margin-top: 0; padding-top: 8px; }
    }
    @media (max-height: 600px) {
      #start .card { padding: 18px 28px; }
      #start h1 { font-size: 44px; } #start .sub { margin-bottom: 12px; }
    }
    #start h1 { margin: 0; font-size: 56px; color: #ffd23f; -webkit-text-stroke: 8px #14161c; text-shadow: 0 5px 0 #14161c; }
    #start .sub { margin: 4px 0 22px; opacity: .7; }
    #start button { width: 100%; padding: 14px; font: 400 24px "Lilita One", system-ui; letter-spacing: .03em; background: #ffd23f;
      color: #14161c; border: 4px solid #14161c; border-radius: 14px; box-shadow: 0 5px 0 #14161c; cursor: pointer;
      transition: transform .08s, box-shadow .08s; }
    #start button:hover { background: #ffe066; transform: translateY(-2px); box-shadow: 0 7px 0 #14161c; }
    #start button:active { transform: translateY(3px); box-shadow: 0 2px 0 #14161c; }
    #start dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 20px 0 0; font-size: 14px; }
    #start dt { opacity: .6; } #start dd { margin: 0; font-weight: 600; }
    #start .name { display: grid; gap: 6px; font-size: 13px; opacity: .9; margin-bottom: 14px; }
    #start input { font: 600 16px system-ui; padding: 10px 12px; background: #0e1116; color: #e9e4d8; border: 1px solid #2c3440; }
    #start button.ghost { margin-top: 10px; background: #4d9cf0; color: #fff; font-size: 19px; -webkit-text-stroke: 3px #14161c; paint-order: stroke fill; }
    #start button.ghost:hover { background: #6db0ff; }
    #settings { margin-top: 14px; font-size: 14px; }
    #settings summary { cursor: pointer; opacity: .8; }
    #settings label { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-top: 10px; }
    #settings input { grid-column: 1 / -1; padding: 0; accent-color: #e2b23c; }
    #settings output { font-weight: 700; color: #e2b23c; }
    #privrow { display: flex; gap: 8px; margin-top: 10px; }
    #privrow button.ghost { margin-top: 0; flex: 1; }
    #mapsel { font: 600 14px system-ui; padding: 0 10px; background: #0e1116; color: #e9e4d8; border: 1px solid #2c3440; }
    #rooms button.room i { font-style: normal; opacity: .6; font-weight: 500; }
    #invite { display: none; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
    #invite input { flex: 1; font-size: 12px; padding: 8px; min-width: 0; }
    #invite button { width: auto; padding: 8px 12px; font-size: 13px; }
    #rooms { display: grid; gap: 6px; margin-top: 10px; }
    #rooms button.room { display: flex; justify-content: space-between; padding: 10px 14px; font: 600 14px system-ui;
      background: #0e1116; color: #e9e4d8; border: 1px solid #2c3440; }
    #rooms button.room:hover { border-color: #e2b23c; }
    #rooms button.room b { color: #6dff7a; }
    #error { color: #ff7b6b; font-size: 14px; min-height: 0; margin: 10px 0 0; }
    #target { position: absolute; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); font-weight: 600; font-size: 14px; color: #ffd9d4; }
    #damage { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(200,20,20,.55)); }
    #dead { position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: 8px; background: rgba(60,0,0,.25); }
    #dead b { font-size: 30px; } #dead span { font-size: 16px; opacity: .85; }
    #xps { position: absolute; left: 50%; top: 72%; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; }
    #xps div { font-size: 15px; font-weight: 600; animation: rise 1.8s ease-out forwards; }
    #xps b { font: 400 20px "Lilita One", system-ui; color: #7cff6b; paint-order: stroke fill; -webkit-text-stroke: 4px #14161c; }
    @keyframes rise { from { transform: translateY(10px); opacity: 0; } 15% { transform: none; opacity: 1; } 75% { opacity: 1; } to { transform: translateY(-16px); opacity: 0; } }
    #levelup { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); display: none; justify-items: center; text-align: center; }
    #levelup.show { display: grid; animation: pop .35s ease-out; }
    #levelup small, #levelup b { font-family: "Lilita One", system-ui; paint-order: stroke fill; -webkit-text-stroke: 6px #14161c; }
    #levelup small { font-size: 28px; color: #ffd23f; }
    #levelup b { font-size: 110px; line-height: 1; color: #fff; text-shadow: 0 6px 0 #14161c; }
    #levelup span { font-size: 18px; font-weight: 700; margin-top: 4px; padding: 4px 12px; background: #14161ccc; border-radius: 8px; }
    #toast { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
    #toast div { padding: 8px 16px; font-size: 15px; font-weight: 700; background: #1d2333ee; border: 3px solid #14161c; border-radius: 12px;
      box-shadow: 0 4px 0 #14161c; animation: pop .25s ease-out; }
    #profile { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    #profile .lvl { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: #ffd23f;
      border: 4px solid #14161c; box-shadow: 0 4px 0 #14161c; color: #14161c; line-height: 1; }
    #profile .lvl small { font: 400 11px "Lilita One", system-ui; margin-top: 6px; }
    #profile .lvl b { font: 400 26px "Lilita One", system-ui; margin-top: -8px; }
    #profile .xp { flex: 1; display: grid; gap: 4px; font-size: 12px; opacity: .9; }
    #profile .bar { height: 12px; background: #0e1116; border: 2px solid #14161c; border-radius: 8px; overflow: hidden; }
    #profile .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7cff6b, #c4ff6b); }
    #pstreak { font-size: 12px; text-align: center; color: #ffb35a; } #pstreak b { font: 400 22px "Lilita One", system-ui; display: block; }
    #pboost { color: #7cff6b; font-size: 13px; font-weight: 700; }
    #daily h3 { margin: 10px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
    #daily .ch { position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; margin-bottom: 5px;
      font-size: 13px; background: #0e1116; border-radius: 8px; overflow: hidden; }
    #daily .ch > * { position: relative; z-index: 1; } #daily .ch i { position: absolute; inset: 0 auto 0 0; background: #2f8ff044; z-index: 0; }
    #daily .ch em { font-style: normal; color: #7cff6b; font-size: 12px; } #daily .ch.done { opacity: .55; }
    #lastmatch { font-size: 13px; margin: 8px 0 0; opacity: .9; }
    #start .row2 { display: flex; gap: 8px; margin: 10px 0 4px; } #start .row2 button { margin-top: 0; }
    #sharemsg { font-size: 13px; margin: 6px 0 0; color: #b8e2ff; } #sharemsg a { color: #ffd23f; }
    #controls { margin-top: 10px; font-size: 14px; } #controls summary { cursor: pointer; opacity: .8; }
    #getapp { display: inline-block; margin-top: 12px; font-size: 14px; color: #ffd23f; }
    .portal #getapp { display: none; }
    #locker { position: fixed; inset: 0; display: none; place-items: center; background: #0b0e13d0; color: #e9e4d8; z-index: 5; }
    #locker .panel { width: min(640px, 94vw); max-height: 88vh; overflow-y: auto; background: #1d2333; border: 4px solid #14161c;
      border-radius: 22px; box-shadow: 0 10px 0 #14161c; padding: 22px 26px; }
    #locker .head { display: flex; justify-content: space-between; align-items: center; }
    #locker h2 { margin: 0; font: 400 40px "Lilita One", system-ui; color: #ffd23f; paint-order: stroke fill; -webkit-text-stroke: 6px #14161c; }
    #locker button { font: 400 17px "Lilita One", system-ui; color: #14161c; background: #ffd23f; border: 3px solid #14161c;
      border-radius: 12px; padding: 8px 14px; cursor: pointer; box-shadow: 0 4px 0 #14161c; }
    #locker .tabs { display: flex; gap: 8px; margin: 16px 0; } #locker .tabs button { background: #4d6280; color: #fff; }
    #locker .tabs button.on { background: #4d9cf0; }
    #items { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    #items .item { display: grid; justify-items: center; gap: 6px; padding: 12px 8px; background: #f2f5fa; }
    #items .item.on { background: #7cff6b; } #items .item.locked { background: #8a93a4; cursor: not-allowed; opacity: .75; }
    #items .item b { font-weight: 400; } #items .item small { font: 600 12px system-ui; }
    #items .sw { width: 56px; height: 40px; border-radius: 8px; border: 3px solid #14161c; background: #d6dbe4; }
    .portal #shareb, .portal:not(.invites) #privrow { display: none !important; }
    #board { position: absolute; inset: 0; display: none; place-content: center; gap: 14px; }
    #board .team { border-top: 3px solid var(--team); background: #10141bdd; }
    #board table { border-collapse: collapse; min-width: 460px; font-size: 15px; }
    #board .cap { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 16px; color: var(--team); }
    #board .cap span { font-size: 20px; font-weight: 800; }
    #board th, #board td { padding: 7px 16px; text-align: left; border-bottom: 1px solid #2c3440; }
    #board th { font-size: 12px; opacity: .6; text-transform: uppercase; }
    #board tr.me td { color: #e2b23c; font-weight: 700; }
    #board tr.dead td { opacity: .45; }
    #board svg { height: 12px; fill: #ffd27a; vertical-align: -1px; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
