<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Outpost</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; font-family: system-ui, sans-serif; user-select: none; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 2px #000a; }
    #xhair { --gap: 5px; position: absolute; left: 50%; top: 50%; }
    #xhair i { position: absolute; background: #6dff7a; box-shadow: 0 0 0 1px #0008; }
    #xhair .t, #xhair .b { width: 2px; height: 8px; left: -1px; }
    #xhair .l, #xhair .r { height: 2px; width: 8px; top: -1px; }
    #xhair .t { bottom: var(--gap); } #xhair .b { top: var(--gap); }
    #xhair .l { right: var(--gap); } #xhair .r { left: var(--gap); }
    #hitmark { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; opacity: 0;
      background: linear-gradient(45deg, transparent 45%, #fff 45% 55%, transparent 55%),
                  linear-gradient(-45deg, transparent 45%, #fff 45% 55%, transparent 55%);
      -webkit-mask: radial-gradient(circle, transparent 5px, #000 5px); mask: radial-gradient(circle, transparent 5px, #000 5px); }
    #hitmark.on { opacity: 1; } #hitmark.head { opacity: 1; filter: sepia(1) saturate(6) hue-rotate(5deg); }
    #hitmark.kill { opacity: 1; filter: sepia(1) saturate(9) hue-rotate(-45deg); transform: scale(1.3); }
    #health, #ammo { position: absolute; bottom: 24px; font-weight: 700; font-size: 34px; display: flex; align-items: baseline; gap: 8px; }
    #health { left: 28px; } #health span { color: #6dff7a; }
    #ammo { right: 28px; } #ammo span { font-size: 18px; opacity: .8; } #ammo b.low { color: #ff6b5b; }
    #reload { position: absolute; bottom: -10px; left: 0; right: 0; height: 4px; background: #0006; display: none; }
    #reload i { display: block; height: 100%; background: #fff; }
    #feed { position: absolute; top: 18px; right: 22px; display: grid; gap: 6px; font-size: 14px; }
    #feed div { background: #000a; padding: 5px 10px; border-left: 3px solid #e2b23c; }
    #stats { position: absolute; top: 18px; left: 22px; font-size: 13px; opacity: .85; }
    #start { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0e13c0; color: #e9e4d8; }
    #start .card { background: #161b22; border: 1px solid #2c3440; padding: 36px 44px; width: min(420px, 90vw); }
    #start h1 { margin: 0; font-size: 44px; letter-spacing: .12em; color: #e2b23c; }
    #start .sub { margin: 4px 0 26px; opacity: .7; }
    #start button { width: 100%; padding: 16px; font: 700 18px system-ui; background: #e2b23c; color: #161b22; border: 0; cursor: pointer; }
    #start button:hover { background: #f0c552; }
    #start dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 24px 0 0; font-size: 14px; }
    #start dt { opacity: .6; } #start dd { margin: 0; font-weight: 600; }
    #start .hint { font-size: 13px; opacity: .6; margin: 18px 0 0; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
