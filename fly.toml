# Fly.io, tuned for cost. Rooms live in this one process's memory, so the game runs on exactly one
# machine: deploy with `fly deploy --ha=false` and never scale above 1.
# Frankfurt: Fly is retiring Warsaw ("waw"); fra is ~20-30 ms from Poland.
app = "clutchzone"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend when nobody is connected (open WebSockets count as connections): an idle game costs
  # about $0.50/month instead of $1.94, and the first visitor wakes it in ~100 ms.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200 # 100 players measured at ~15% of a laptop core; protect the shared CPU

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Smallest preset ($1.94/month while running): measured 131 MB RSS with 100 players.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
